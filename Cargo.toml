[package]
name = "excel-mcp-server"
version = "0.2.1"
edition = "2024"
rust-version = "1.94.1"
authors = ["James Karanja Maina"]
license = "Apache-2.0"
description = "An MCP server that exposes Excel manipulation tools over stdio and streamable HTTP transports"
repository = "https://github.com/zavora-ai/excel-mcp-server"
homepage = "https://zspreadsheet.com"
keywords = ["mcp", "excel", "spreadsheet", "xlsx"]
categories = ["command-line-utilities"]

[dependencies]
rmcp = { version = "3.1.2", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
zavora-xlsx = "0.1.1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
rmcp = { version = "3.1.2", features = ["client", "transport-io"] }

# Development arrangement, not a release one.
#
# The published 0.1.1 silently discards a write to a cell that already had a value: the
# parsed original clobbers the authored write when the sheet is serialised, so "change this
# number" reported success and changed nothing. Fixed in the checkout beside this one; this
# points at it until a version carrying the fix is released.
[patch.crates-io]
zavora-xlsx = { path = "../../zavora-xlsx" }

[workspace]
